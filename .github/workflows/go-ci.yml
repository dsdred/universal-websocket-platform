name: Go CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: '1.26.5'
          cache: false
      - name: Check tracked Go formatting
        run: |
          set -euo pipefail
          tracked_files=$(mktemp)
          trap 'rm -f "$tracked_files"' EXIT
          git ls-files -z -- '*.go' > "$tracked_files"
          while IFS= read -r -d '' file; do
            unformatted=$(gofmt -l "./$file")
            if [[ -n "$unformatted" ]]; then
              printf 'Go formatting required: %s\n' "$file" >&2
              exit 1
            fi
          done < "$tracked_files"
      - name: Build
        run: go build -mod=readonly ./...
      - name: Test
        run: go test -mod=readonly -count=1 ./...
      - name: Vet
        run: go vet -mod=readonly ./...
      - name: Race test
        env:
          CGO_ENABLED: '1'
        run: go test -mod=readonly -race -count=1 ./...
      - name: Check module tidiness
        run: go mod tidy -diff
      - name: Check unchanged module files
        run: git diff --exit-code -- go.mod go.sum
